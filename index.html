<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PARTY ARENA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b0b12;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 40px;
    }

    .btn {
      width: 100%;
      padding: 17px;
      margin: 8px 0;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      color: white;
      background: #6c3cff;
      cursor: pointer;
    }

    .btn.secondary {
      background: #1b1b27;
      border: 1px solid #333344;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .version {
      margin-top: 30px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">🎮 PARTY ARENA</div>

    <div class="subtitle">
      Play. Compete. Have fun.
    </div>

    <button class="btn" onclick="createRoom()">
      🎮 CREATE ROOM
    </button>

    <button class="btn secondary" onclick="joinRoom()">
      🔑 JOIN ROOM
    </button>

    <button class="btn secondary" onclick="leaderboard()">
      🏆 LEADERBOARD
    </button>

    <div class="version">
      PARTY ARENA • v1.0
    </div>

  </div>

  <script>
    function createRoom() {
      alert("Create Room coming next!");
    }

    function joinRoom() {
      alert("Join Room coming next!");
    }

    function leaderboard() {
      alert("Leaderboard coming next!");
    }
  </script>

</body>
</html>
